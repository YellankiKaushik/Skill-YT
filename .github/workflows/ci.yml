name: CI
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: ruff check src tests scripts
      - run: pytest -q
      - run: python -m secure_inbox.cli
  docker-inspector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[test]"
      - run: docker info
      - run: docker build -t secure-inbox-html-inspector:local scripts/sandbox
      - run: pytest -q tests/test_sandbox.py tests/test_docker_integration.py
        env:
          SECURE_INBOX_DOCKER_INTEGRATION: "1"

