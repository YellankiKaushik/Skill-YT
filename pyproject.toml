[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secure-inbox-agent"
version = "0.1.0"
description = "Draft-only Gmail inbox assistant with explicit security boundaries"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
gmail = ["google-api-python-client>=2.120", "google-auth-oauthlib>=1.2"]
test = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
secure-inbox = "secure_inbox.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E9", "F"]

